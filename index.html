<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Tu Dato</title>
  <style>
    body {
      background-color: #0b141a;
      color: #8696a0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-size: 14px;
    }
    .loader {
      border: 3px solid #1f2c34;
      border-top: 3px solid #25D366;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div style="text-align: center;">
    <div class="loader"></div>
    <p id="status">Abriendo grupo disponible...</p>
  </div>

  <script>
    (function () {
      const grupos = [
        "https://chat.whatsapp.com/IeoLx3VRBdE8Cy84sZPEfe?s=cl&p=a&iam=2",
        "https://chat.whatsapp.com/Jm308gdy7Tx7EFJNSGnNsO?s=cl&p=a&iam=2",
        "https://chat.whatsapp.com/EiacBS2wARlEzikA7LpCX9?s=cl&p=a&iam=2",
        "https://chat.whatsapp.com/Cltf4PwOBnUESaGtYewj9P?s=cl&p=a&iam=2",
        "https://chat.whatsapp.com/By4GSO7o03mFa5q9t6kl1R?s=cl&p=a&iam=2",
        "https://chat.whatsapp.com/LpLIHdlynvJDF6nWadQw9X?s=cl&p=a&iam=2"
      ];

      const ua = navigator.userAgent || "";
      const esBot = /facebookexternalhit|Facebot|WhatsApp|Twitterbot|TelegramBot|Googlebot|bingbot|crawler|spider|bot|headless|phantom|selenium|puppeteer/i.test(ua);
      const esWebDriver = navigator.webdriver === true;

      if (esBot || esWebDriver) {
        document.getElementById("status").innerText = "Comunidad Deportiva Tu Dato.";
        return;
      }

      setTimeout(function () {
        const indice = Math.floor(Math.random() * grupos.length);
        window.location.replace(grupos[indice]);
      }, 400);
    })();
  </script>
</body>
</html>
